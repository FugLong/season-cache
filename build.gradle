plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "java"
    id "com.modrinth.minotaur" version "2.+"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Serene Seasons — compile-time only, not bundled.
    // Place the SS jar for your target MC version in the libs/ directory.
    // Required at runtime — enforced via the "depends" entry in fabric.mod.json.
    compileOnly fileTree(dir: "libs", include: "*.jar")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Modrinth publishing
// Set MODRINTH_TOKEN in your environment before running ./gradlew modrinth
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "seasoncache"
    versionNumber = project.mod_version
    versionName = "Season Cache ${project.mod_version}"
    versionType = "release"
    uploadFile = jar
    additionalFiles = [sourcesJar]
    gameVersions = ["26.1", "26.1.1", "26.1.2"]
    loaders = ["fabric"]
    changelog = file("CHANGELOG.md").text
    dependencies {
        required.project "serene-seasons"
        required.project "fabric-api"
    }
}
